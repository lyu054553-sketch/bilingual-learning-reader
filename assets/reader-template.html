<body>
<div class="app">
<aside class="sidebar" aria-label="章节导航"><div class="brand"><span class="brand-icon" aria-hidden="true"></span>READ NOTES</div><div class="side-sub">一份可以查词的双语文稿</div><div class="side-label">CONTENTS / 章节</div><nav id="chapters" class="chapters"></nav><div class="side-bottom"><button class="saved-button" data-open-saved><span>☆ 我的生词本</span><span class="count" id="savedCount">0</span></button><div class="side-foot">黄色高亮 · 雅思重点词汇</div></div></aside>
<main class="reader" id="reader">
<header class="toolbar"><div class="toolbar-line"><span class="crumb">阅读室 <span class="desktop-label">/ 双语学习</span></span><div class="top-buttons"><button class="small-btn" id="fontSize" aria-label="调整文稿字号">Aa +</button><button class="small-btn" id="toggleZh" aria-pressed="false">隐藏中文</button><button class="small-btn" data-open-saved>☆ <span class="desktop-label">生词本</span><span id="topSavedCount">0</span></button><button class="small-btn dict-peek" id="peekDict">词典</button></div></div><div class="search-row"><label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="搜索全文，支持英文与中文" aria-label="搜索中英文文稿"><button id="clearSearch" type="button" aria-label="清除搜索" hidden>×</button></label><span class="reading-count" id="readingCount"></span></div><select class="mobile-nav" id="chapterSelect" aria-label="选择章节"></select><div class="progress"><div class="progress-fill" id="progressFill"></div></div></header>
<article class="document"><div class="eyebrow" id="docEyebrow"></div><h1 id="docTitle"></h1><div class="subtitle" id="docSubtitle" style="white-space:pre-line"></div><div class="meta-line" id="docMeta"></div><div class="read-hint"><span>点击任意英文单词，查看词义与原文例句。</span><span class="hint-secondary">英语在左 · 中文在右</span></div><div class="column-heading"><span>ENGLISH / 英文</span><span>中文 / TRANSLATION</span></div><div id="transcript"></div><div class="pager" id="pager"><button class="page-btn" id="prevChapter">← 上一章</button><button class="page-btn" id="nextChapter">下一章 →</button></div><footer class="doc-footer"><span id="docFooter"></span><br>黄色为学习重点，并非官方指定词表。<button id="aboutButton">词典来源与说明</button></footer></article>
</main>
<aside class="dictionary" id="dictionary" aria-label="单词词典"><header class="dict-header"><span>WORD NOTES / 单词笔记</span><button id="closeDict" aria-label="关闭词典">×</button></header><div class="dict-body" id="dictBody"></div><footer class="dict-source" id="dictSource"></footer></aside>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
</div>
<button class="scroll-top" id="backTop" aria-label="回到文稿顶部" hidden>↑ 顶部</button><div class="toast" id="toast" role="status" hidden></div>
<dialog id="savedDialog" aria-labelledby="savedTitle"><div class="modal-header"><h2 id="savedTitle">我的生词本</h2><div class="modal-actions"><button class="small-btn" id="importLibrary">导入最新生词本</button><button class="small-btn" id="exportChanges">导出同步记录</button><button class="small-btn" id="exportSaved">导出词表</button><input id="libraryFile" type="file" accept="application/json,.json" hidden><button class="close-btn" data-close-dialog="savedDialog" aria-label="关闭生词本">×</button></div></div><div class="modal-body"><p class="modal-copy" id="syncStatus"></p><p class="modal-copy">阅读后导出同步记录，交给 Agent 合并。导入最新生词本可以更新本页；浏览器收藏不会自动写入学习库。</p><div id="savedList"></div></div></dialog>
<dialog id="aboutDialog" aria-labelledby="aboutTitle"><div class="modal-header"><h2 id="aboutTitle">词典来源与阅读说明</h2><button class="close-btn" data-close-dialog="aboutDialog" aria-label="关闭说明">×</button></div><div class="modal-body"><p class="modal-copy" id="aboutCopy"></p><details><summary class="modal-copy">词库许可声明</summary><pre class="license" id="license"></pre></details></div></dialog>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('app-data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=s=>String(s).toLowerCase().replace(/’/g,"'");
const tokenPattern=/[A-Za-z]+(?:['’][A-Za-z]+)?/g;
const copy=x=>JSON.parse(JSON.stringify(x));
const newId=()=>globalThis.crypto?.randomUUID?.()||'op-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const validKey=k=>typeof k==='string'&&k.startsWith('en:')&&k.length>3&&k.length<200;
function validateLibrary(x){
 if(!x||x.kind!=='bilingual-learning-library'||x.schema_version!==1||typeof x.library_id!=='string'||!x.library_id||!Number.isInteger(x.revision)||x.revision<0||!x.favorites||typeof x.favorites!=='object'||Array.isArray(x.favorites)||!Array.isArray(x.processed_operation_ids)||!x.processed_operation_ids.every(id=>typeof id==='string'))throw Error('这不是支持的正式生词本文件。');
 for(const [k,e] of Object.entries(x.favorites)){if(!validKey(k)||!e||e.key!==k||typeof e.head!=='string'||typeof e.meaning!=='string'||!['active','removed'].includes(e.status)||!Number.isInteger(e.updated_revision)||e.updated_revision<0||e.updated_revision>x.revision||!Array.isArray(e.examples)||!Array.isArray(e.forms)||!e.forms.every(f=>typeof f==='string'))throw Error('生词本的词条格式不完整。');for(const a of e.examples)if(!a||typeof a.article_id!=='string'||typeof a.en!=='string'||typeof a.zh!=='string')throw Error('例句格式不完整。');}
 return x;
}
function canonical(x){if(Array.isArray(x))return x.map(canonical);if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().map(k=>[k,canonical(x[k])]));return x}
function validOperations(xs){return Array.isArray(xs)&&xs.every(o=>o&&typeof o.operation_id==='string'&&Number.isInteger(o.base_revision)&&o.base_revision>=0&&validKey(o.key)&&(['upsert','remove'].includes(o.action))&&(o.action==='remove'||o.entry&&o.entry.key===o.key&&typeof o.entry.head==='string'&&typeof o.entry.meaning==='string'&&Array.isArray(o.entry.examples)&&o.entry.examples.every(a=>a&&typeof a.article_id==='string'&&typeof a.en==='string'&&typeof a.zh==='string')&&Array.isArray(o.entry.forms)&&o.entry.forms.every(f=>typeof f==='string')));}
const meta=DATA.meta;validateLibrary(DATA.library);
const storagePrefix='bilingual-reader:v1:'+DATA.library.library_id+':'+meta.article_id+':';
let storageFailed=false,toastTimer;
const storage={get(k,f){try{const v=JSON.parse(localStorage.getItem(storagePrefix+k));return v===null?f:v}catch{storageFailed=true;return f}},set(k,v){try{localStorage.setItem(storagePrefix+k,JSON.stringify(v));return true}catch{storageFailed=true;return false}}};
let base=copy(DATA.library),operations=[],favorites={},conflicts=0;
const cached=storage.get('session',null);
if(cached){try{validateLibrary(cached.base);if(cached.base.library_id!==base.library_id||!validOperations(cached.operations))throw Error();if(cached.base.revision>=base.revision)base=cached.base;operations=cached.operations}catch{storageFailed=true}}

function wordHTML(text,row){let out='',last=0;for(const m of text.matchAll(tokenPattern)){out+=esc(text.slice(last,m.index));const w=normal(m[0]);out+=`<button class="word${DATA.dict[w]?.study?' key':''}${active(keyOf(w))?' collected':''}${selected===w?' selected':''}" data-word="${esc(w)}" data-row="${row}" aria-label="查看 ${esc(m[0])} 的词义">${esc(m[0])}</button>`;last=m.index+m[0].length}return out+esc(text.slice(last))}
