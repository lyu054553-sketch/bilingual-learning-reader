/* Reading-first editorial refinement. Append after the original stylesheet.
   Offline system fonts; existing 1200px dictionary JS breakpoint is preserved. */
:root {
  --paper: #fbfaf6;
  --white: #fffefb;
  --ink: #28332b;
  --muted: #626b60;
  --line: #dedfd4;
  --yellow: #f6e7a0;
  --green: #315c49;
  --soft-green: #eaf0e8;
  --rail: #f2f3eb;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'Noto Serif CJK SC', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
html { color-scheme: light; scroll-padding-top: 11rem; }
body { font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
body, button, input, select, textarea { font-family: var(--sans); }
button, a, input, select, textarea, summary { touch-action: manipulation; }
button, input, select, textarea { max-width: 100%; }
button { transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
button:disabled { cursor: not-allowed; }
a { text-underline-offset: .2em; text-decoration-thickness: 1px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--green);
  outline-offset: 3px;
}
::selection { background: #d9e5d6; color: var(--ink); }
.skip-link { position: fixed; inset: 12px auto auto 12px; z-index: 50; padding: 12px 18px; background: var(--green); color: white; transform: translateY(-180%); }
.skip-link:focus { transform: translateY(0); }
.app { max-width: 1840px; margin: 0 auto; grid-template-columns: 200px minmax(0, 1fr) 310px; min-height: 100dvh; }
.sidebar { height: 100dvh; padding: 29px 13px 18px; background: var(--rail); }
.brand { gap: 9px; padding: 0 12px; font-size: 13px; letter-spacing: .12em; color: var(--green); }
.brand-icon { flex-shrink: 0; width: 21px; height: 25px; border-color: var(--green); }
.brand-icon:after { left: 3px; border-color: var(--green); }
.side-sub { font-size: 11px; padding: 9px 12px 35px; line-height: 1.65; }
.side-label { font-size: 10px; letter-spacing: .11em; padding-bottom: 12px; }
.chapters { scrollbar-gutter: stable; }
.nav-item { min-height: 48px; grid-template-columns: 22px minmax(0, 1fr); gap: 5px; margin: 3px 0; padding: 10px 11px; border-radius: 4px; font-size: 12px; line-height: 1.6; }
.nav-item:hover { background: #e8ebe1; }
.nav-item.active { color: #244833; background: #e0e8dc; box-shadow: inset 2px 0 var(--green); font-weight: 600; }
.nav-num, .nav-time { font-size: 10px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.side-bottom { margin-top: 20px; padding-top: 13px; }
.saved-button { min-height: 44px; gap: 8px; align-items: center; padding: 9px 11px; font-size: 12px; border-radius: 4px; }
.saved-button:hover { background: #e6ebdf; }
.count { background: #dde6d8; color: #34543b; border-radius: 4px; line-height: 21px; }
.side-foot { font-size: 10px; line-height: 1.7; }
.toolbar { background: var(--paper); padding: 14px 32px 15px; }
.toolbar-line { gap: 12px; flex-wrap: wrap; }
.crumb { font-size: 11px; letter-spacing: .02em; }
.top-buttons { flex-wrap: wrap; gap: 6px; }
.small-btn, .action-btn, .page-btn, .row-reveal,
.learning-toolbar button, .review-actions button, .review-rating button {
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--white);
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
}
.small-btn:hover, .action-btn:hover, .page-btn:hover, .row-reveal:hover,
.learning-toolbar button:hover, .review-actions button:hover, .review-rating button:hover { border-color: #a9b5a3; background: #f0f3e9; }
.small-btn[aria-pressed=true], .action-btn.saved,
.learning-toolbar button[aria-pressed=true], .reading-mode button[aria-checked=true] { background: #e1eadc; border-color: #a2b69a; color: #294d37; }
.small-btn:active, .action-btn:active, .page-btn:active, .row-reveal:active { background: #dde7d7; }
.small-btn:disabled, .page-btn:disabled, .review-actions button:disabled { opacity: .55; }
.search-row { margin-top: 10px; gap: 12px; }
.search-box { min-width: 0; min-height: 44px; border-color: #d5d9cd; background: var(--white); border-radius: 5px; }
.search-box:focus-within { outline: 3px solid var(--green); outline-offset: 2px; }
.search-icon { font-size: 20px; padding-left: 12px; padding-right: 8px; }
#search { min-width: 0; min-height: 44px; font-size: 13px; padding-right: 45px; outline: none; }
#search:focus-visible { outline: none; }
#search::placeholder { color: #71796c; opacity: 1; }
#clearSearch { min-width: 44px; min-height: 44px; right: 0; font-size: 22px; border-radius: 4px; }
.reading-count { font-size: 11px; font-variant-numeric: tabular-nums; }
.progress { height: 2px; background: #e4e7dc; }
.progress-fill { background: #597d60; transition: none; }
.document { max-width: 1000px; padding: 38px 32px 54px; }
.eyebrow { font-size: 10px; letter-spacing: .13em; margin-bottom: 13px; font-weight: 600; }
.document h1 { font: 400 clamp(29px, 2.65vw, 40px)/1.24 var(--serif); letter-spacing: -.025em; max-width: 24ch; margin-bottom: 17px; text-wrap: balance; overflow-wrap: anywhere; }
.subtitle { max-width: 64ch; font-size: 14px; line-height: 1.85; color: #525e50; }
.meta-line { font-size: 11px; gap: 10px; margin-top: 19px; }
.meta-dot { background: #77816f; }
.highlight-swatch { width: 17px; height: 9px; border-radius: 1px; transform: none; }
.read-hint { background: transparent; padding: 13px 0; margin-top: 24px; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; font-size: 12px; color: var(--muted); }
.column-heading { margin-top: 29px; font-size: 10px; letter-spacing: .13em; padding-bottom: 12px; }
.column-heading span:nth-child(2) { padding-left: 26px; }

  return [...events.values()].sort((a,b) => (Date.parse(a.reviewed_at)-Date.parse(b.reviewed_at)) || a.event_id.localeCompare(b.event_id));
}
let latestReviewCache = null;
function lastReview(key) {
  if (!latestReviewCache || latestReviewCache.base !== base.review_events || latestReviewCache.pending !== reviewEvents || latestReviewCache.length !== reviewEvents.length) {
    const entries = new Map(); for (const event of allReviewEvents()) entries.set(event.key,event);
    latestReviewCache = {base:base.review_events,pending:reviewEvents,length:reviewEvents.length,entries};
  }
  return latestReviewCache.entries.get(key);
}
function reviewableEntries() {
  return Object.entries(favorites).filter(([,e]) => e.status === 'active' && e.meaning.trim() && !/含义待确认|暂未找到|未知释义/.test(e.meaning));
}
function dueEntries() {
  const today = localDate();
  return reviewableEntries().filter(([k]) => !lastReview(k) || lastReview(k).due_at <= today)
    .sort(([a],[b]) => (lastReview(a)?.due_at || '').localeCompare(lastReview(b)?.due_at || ''));
}
function updateSessionStatus() {
  const pending = operations.length + reviewEvents.length;
  $('sessionStatus').textContent = pending ? `${pending} 条记录待导出同步` : '本页没有待同步记录';
  if(storageFailed)$('sessionStatus').textContent+=' · 缓存异常，请导出保存';
  $('sessionStatus').classList.toggle('sync-warning', pending > 0 || storageFailed);
  $('sessionStatus').title = '收藏与复习记录先保存在本页；导出 JSON 交给 Agent 后，才会进入下一篇文章。';
  $('reviewDue').textContent = dueEntries().length;
}
function practiceHTML(c) {
  if (!Array.isArray(c.practice) || !c.practice.length) return '';
  const open = practiceChapters.has(c.id);
  return `<section class="chapter-practice" aria-label="本节回想练习">
    <div class="practice-heading"><div><span class="section-label">读后回想</span><h3>用自己的话，留下理解。</h3></div>
    <button class="action-btn" data-practice-start="${c.id}" aria-expanded="${open}" aria-controls="practice-${c.id}">${open?'返回原文':'收起本节原文，试着回想'}</button></div>
    <div id="practice-${c.id}" ${open?'':'hidden'}><p class="dict-tip">先尝试，再展开参考。可以用中文回答；不用追求与参考答案一字不差。</p>
    ${c.practice.map((q,i) => {const id = `${c.id}:${q.id || i}`;return `<div class="practice-question"><label for="draft-${c.id}-${i}">${esc(q.question)}</label>
      <textarea id="draft-${c.id}-${i}" data-draft="${esc(id)}" rows="3" placeholder="写下你的理解，也可以先在心里回答。">${esc(practiceDrafts[id] || '')}</textarea>
      <details><summary>查看参考与原文依据</summary><p>${esc(q.answer)}</p><div class="practice-evidence">${(q.evidence || []).filter(n=>rowsById.has(n)).map(n=>`<button class="text-btn" data-evidence="${n}">核对第 ${n} 句 ↗</button>`).join(' ')}</div></details></div>`}).join('')}
      <p class="dict-tip">回答草稿仅保存在当前网页缓存中，不进入生词同步文件。它是练习，不是评分。</p>
    </div></section>`;
}
function translationHTML(r) {
  const reveal = !hideZh || revealedRows.has(r.n);
  return `<div class="zh"><button class="row-reveal" data-reveal="${r.n}" aria-expanded="${reveal}" aria-controls="translation-${r.n}" ${hideZh?'':'hidden'}>${reveal?'收起译文':'想好意思，再看译文'}</button><div id="translation-${r.n}" ${reveal?'':'hidden'}>${hitText(r.zh)}</div></div>`;
}
function renderTranscript() {
  const visible = query ? DATA.pairs.filter(r=>r.en.toLowerCase().includes(query.toLowerCase()) || r.zh.includes(query)) :
    DATA.pairs.filter(r=>chapter===-1 || r.chapter===chapter);
  let html = query ? `<div class="chapter-heading"><h2>全文搜索</h2><span class="label">${visible.length} 句匹配</span></div>` : '';
  let last = null;
  for (const r of visible) {
    if (!query && r.chapter !== last) {
      if (last !== null) html += practiceHTML(DATA.chapters[last]);
      const c=DATA.chapters[r.chapter];
      html += `<section class="chapter-heading"><h2>${String(c.id+1).padStart(2,'0')} / ${esc(c.title)}</h2><span class="label">${esc(timeLabel(c.time))}</span></section>`;
      last = r.chapter;
    }
    if (!query && practiceChapters.has(r.chapter)) continue;
    const u=sourceUrl(r), label=`${esc(position(r))} <span class="sentence-number">${String(r.n).padStart(3,'0')}</span>`;
    html += `<div class="sentence${selected && r.n===selectedRow?' current':''}" id="row-${r.n}"><div class="sentence-meta">${u?`<a class="timestamp" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<span class="timestamp">${label}</span>`}</div><div class="en">${wordHTML(r.en,r.n)}</div>${translationHTML(r)}</div>`;
  }
  if (!query && last !== null) html += practiceHTML(DATA.chapters[last]);
  $('transcript').innerHTML = html || '<div class="empty">没有找到这段内容。<br>试试更短的英文词或中文关键词。</div>';
  $('readingCount').textContent = query ? `${visible.length} / ${DATA.pairs.length} 句` : `${visible.length} 句 · ${chapter===-1?'全文':(chapter+1)+' / '+DATA.chapters.length+' 章'}`;
  $('pager').hidden=!!query || chapter===-1 || DATA.chapters.length<2;
  $('prevChapter').disabled=chapter<=0; $('nextChapter').disabled=chapter>=DATA.chapters.length-1;
  renderNav(); updateProgress();
}
function applySettings() {
  document.documentElement.style.setProperty('--font',sizes[fontIndex]+'px');
  $('reader').classList.toggle('english-first',hideZh);
  $('toggleZh').textContent=hideZh?'先读英文':'中英对照';
  $('toggleZh').setAttribute('aria-pressed',hideZh);
  $('readingMode').value=hideZh?'english':'parallel';
  $('fontSize').textContent=['Aa +','Aa ++','Aa ↺'][fontIndex];
}
function startReview(all=false) {
  reviewQueue=(all?reviewableEntries():dueEntries()).map(([key])=>key);
  reviewIndex=0; reviewCompleted=0; reviewRevealed=false;
  if ($('savedDialog').open) $('savedDialog').close();
  closeDict();
  renderReview();
  if (!$('reviewDialog').open) $('reviewDialog').showModal();
}
function renderReview() {
  const key=reviewQueue[reviewIndex], entry=favorites[key];
  if (!entry) {
    const next=reviewableEntries().map(([k])=>lastReview(k)?.due_at).filter(Boolean).sort()[0];
    $('reviewBody').innerHTML=`<div class="review-finish"><span class="section-label">${reviewQueue.length?'本次练习结束':'现在没有到期生词'}</span><h3>${reviewQueue.length?`记录了 ${reviewCompleted} 次自评。`:'给记忆留一点间隔。'}</h3><p>${reviewCompleted?'下次再尝试时，看看能否在不看答案的情况下想起来。':next?`下次建议日期：${esc(next)}。你也可以提前练习。`:'阅读时收藏想记住的词，之后可在这里复习。'}</p><p class="dict-tip">自评记录帮助安排复习，不代表已掌握。${reviewEvents.length?'本次记录尚待同步。':''}</p><div class="review-actions">${reviewableEntries().length?'<button class="action-btn" id="reviewAll">练习全部生词</button>':''}<button class="action-btn" id="reviewExport">导出同步记录</button></div></div>`;
    if ($('reviewAll')) $('reviewAll').onclick=()=>startReview(true);
    $('reviewExport').onclick=exportChanges;
    return;
  }
  const example=entry.examples.find(e=>e.meaning) || entry.examples[0];
  const previous=lastReview(key);
  const target=Math.min(4,(previous?.step ?? 0)+1);
  const intervals=[1,3,7,14,30];
  $('reviewBody').innerHTML=`<div class="review-progress">本次第 ${reviewIndex+1} / ${reviewQueue.length} 词 <span>先回想 · 再核对</span></div>
    <h3 class="review-word">${esc(entry.head)}</h3><p class="review-prompt">回想这个词的含义，再试着说出一个搭配。需要时可以展开原文提示。</p>
    ${example?`<details class="review-context" ${reviewRevealed?'open':''}><summary>需要一点语境提示</summary><p class="example-en">${esc(example.en)}</p><cite>${esc(example.article_title || example.article_id)}</cite></details>`:'<p class="dict-tip">没有原句记录，请先回想这个词的含义和用法。</p>'}
    <button class="text-btn" id="skipReview">跳过此词，不记结果</button><button class="action-btn review-reveal" id="revealAnswer" ${reviewRevealed?'hidden':''}>我已尝试，查看答案</button>
    <div class="review-answer" ${reviewRevealed?'':'hidden'}><div class="section-label">参考含义</div><p class="meaning">${esc(example?.meaning || entry.meaning)}</p>${example?`<p class="example-zh">${esc(example.zh)}</p>`:''}${entry.usage?`<p class="collocation">${esc(entry.usage)}</p>`:''}
    <p class="review-prompt">看答案之前，你回想得怎样？</p><div class="review-ratings"><button class="action-btn" data-rate="again">没想起来 <small>建议明天</small></button><button class="action-btn" data-rate="hard">有些费力 <small>建议 ${intervals[previous?.step || 0]} 天后</small></button><button class="action-btn" data-rate="good">较轻松 <small>建议 ${intervals[target]} 天后</small></button></div>
    <details class="review-schedule"><summary>调整下次复习日期</summary><label for="reviewDate">选择日期后，将覆盖上面的建议。</label><input type="date" id="reviewDate" min="${localDate()}" aria-label="下次复习日期"></details><p class="dict-tip">日期按本机时区计算。间隔是可调整的练习建议，没有诊断或预测记忆能力。</p></div>`;
  $('skipReview').onclick=()=>{reviewIndex++;reviewRevealed=false;renderReview();$('reviewTitle').focus()};
  $('revealAnswer').onclick=()=>{reviewRevealed=true;renderReview();$('reviewBody').querySelector('[data-rate]')?.focus()};
}
function rateReview(rating) {
  if (!reviewRevealed || !['again','hard','good'].includes(rating)) return;
  const key=reviewQueue[reviewIndex]; if (!key || !active(key)) return;
  const previous=lastReview(key), oldStep=previous?.step || 0;
  const step=rating==='again'?0:rating==='hard'?oldStep:Math.min(4,oldStep+1);

  reviewEvents.push({event_id:newId(),key,rating,reviewed_at:new Date(Math.max(Date.now(),previous ? Date.parse(previous.reviewed_at)+1 : 0)).toISOString(),due_at:custom || afterDays([1,3,7,14,30][step]),step,article_id:meta.article_id});
  persist(); updateSessionStatus(); reviewIndex++;reviewCompleted++;reviewRevealed=false;renderReview();

}
function learningEvents() {
  $('transcript').onclick=e=>{
    const word=e.target.closest('[data-word]'); if(word){openWord(word.dataset.word,Number(word.dataset.row));return;}
    const reveal=e.target.closest('[data-reveal]');
    if(reveal){const n=Number(reveal.dataset.reveal);if(revealedRows.has(n))revealedRows.delete(n);else revealedRows.add(n);const show=revealedRows.has(n);$('translation-'+n).hidden=!show;reveal.textContent=show?'收起译文':'想好意思，再看译文';reveal.setAttribute('aria-expanded',show);return;}
    const practice=e.target.closest('[data-practice-start]');
    if(practice){const c=Number(practice.dataset.practiceStart);if(practiceChapters.has(c))practiceChapters.delete(c);else {practiceChapters.add(c);$('dictionary').classList.remove('open');selected=null;renderDictionary();}renderTranscript();const b=$('transcript').querySelector(`[data-practice-start="${c}"]`);b?.focus({preventScroll:true});b?.scrollIntoView({block:'center',behavior:'smooth'});return;}
    const evidence=e.target.closest('[data-evidence]');if(evidence){const n=Number(evidence.dataset.evidence);practiceChapters.delete(rowsById.get(n).chapter);renderTranscript();locate(n);}
  };
  $('transcript').oninput=e=>{if(e.target.matches('[data-draft]')){practiceDrafts[e.target.dataset.draft]=e.target.value;storage.set('practiceDrafts',practiceDrafts);}};
  const changeMode=english=>{hideZh=english;revealedRows.clear();storage.set('hideZh',hideZh);applySettings();renderTranscript()};
  $('toggleZh').onclick=()=>changeMode(!hideZh);
  $('readingMode').onchange=e=>changeMode(e.target.value==='english');
  document.querySelectorAll('[data-start-review]').forEach(b=>b.onclick=()=>startReview());
  $('reviewBody').onclick=e=>{const b=e.target.closest('[data-rate]');if(b)rateReview(b.dataset.rate)};
  $('sessionStatus').onclick=()=>{renderSaved();$('savedDialog').showModal()};
  $('loadError').hidden=true;
  updateSessionStatus();
}

function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;$('progressFill').style.width=(max>0?Math.min(100,Math.max(0,scrollY/max*100)):100)+'%';$('backTop').hidden=scrollY<700}
$('transcript').onclick=e=>{const b=e.target.closest('[data-word]');if(b)openWord(b.dataset.word,Number(b.dataset.row))};$('chapters').onclick=e=>{const b=e.target.closest('[data-chapter]');if(b)setChapter(Number(b.dataset.chapter))};$('chapterSelect').onchange=e=>setChapter(Number(e.target.value));
let searchTimer;$('search').oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=e.target.value.trim();$('clearSearch').hidden=!query;renderTranscript()},160)};$('clearSearch').onclick=()=>{clearTimeout(searchTimer);query='';$('search').value='';$('clearSearch').hidden=true;renderTranscript();$('search').focus()};$('prevChapter').onclick=()=>setChapter(chapter-1);$('nextChapter').onclick=()=>setChapter(chapter+1);$('fontSize').onclick=()=>{fontIndex=(fontIndex+1)%sizes.length;storage.set('fontIndex',fontIndex);applySettings()};$('toggleZh').onclick=()=>{hideZh=!hideZh;storage.set('hideZh',hideZh);applySettings()};$('closeDict').onclick=closeDict;$('backdrop').onclick=closeDict;$('peekDict').onclick=()=>{$('dictionary').classList.add('open');syncDictionaryMode();$('closeDict').focus()};$('backTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',()=>{updateProgress();syncDictionaryMode()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]'))closeDict();if(e.key==='Tab'&&!document.querySelector('dialog[open]')&&innerWidth<1200&&$('dictionary').classList.contains('open')){const xs=[...$('dictionary').querySelectorAll('button,a,summary')].filter(n=>n.getClientRects().length),first=xs[0],last=xs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.querySelectorAll('[data-open-saved]').forEach(b=>b.onclick=()=>{renderSaved();$('savedDialog').showModal()});document.querySelectorAll('[data-close-dialog]').forEach(b=>b.onclick=()=>$(b.dataset.closeDialog).close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));$('savedList').onclick=e=>{const remove=e.target.closest('[data-remove]'),loc=e.target.closest('[data-saved-locate]');if(remove)recordOperation('remove',remove.dataset.remove);else if(loc){$('savedDialog').close();locate(Number(loc.dataset.savedLocate))}};$('exportSaved').onclick=exportSaved;$('exportChanges').onclick=exportChanges;$('importLibrary').onclick=()=>$('libraryFile').click();$('libraryFile').onchange=e=>importLibrary(e.target.files[0]);$('aboutButton').onclick=()=>$('aboutDialog').showModal();
mergeView();persist();renderMeta();applySettings();renderTranscript();updateCounts();renderDictionary();learningEvents();if(storageFailed)toast('浏览器缓存不可用，收藏后请及时导出同步记录。');else if(conflicts)toast('有收藏与新版记录冲突，请导出交给 Agent 处理。');
